name: Browser QA - Gamo Transfer
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "domain.js"
      - "agency-reports.js"
      - "ui-preferences.js"
      - "version-check.js"
      - "styles.css"
      - "tests/browser.py"
      - "tests/*.test.js"
      - "tests/test_deployment.py"
      - "scripts/verify_deployment.py"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/browser-qa.yml"
permissions:
  contents: read
concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-static:
    name: Node tests and deployment verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Operational, finance and interface unit tests
        run: node --test tests/*.test.js
      - name: JS syntax and deployment verifier tests
        run: |
          node --check app.js
          node --check domain.js
          node --check ui-preferences.js
          node --check agency-reports.js
          node --check version-check.js
          python3 -m unittest discover -s tests -p test_deployment.py -v
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Run responsive and operational browser tests
        run: python -m unittest discover -s tests -p browser.py -v
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamo-chromium-qa-evidence
          path: |
            /tmp/gamo-*.png
            /tmp/gamo-documento.pdf
            /tmp/gamo-loading-baseline.json
          if-no-files-found: ignore

  cross-browser-smoke:
    name: Cross-browser smoke (${{ matrix.browser }})
    # Playwright 1.55 WebKit/Firefox no admiten el runner Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      GAMO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and browser
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install --with-deps "$GAMO_BROWSER"
      - name: Run cross-browser navigation and mobile smoke tests
        run: |
          python -m unittest discover -s tests -p browser.py -k test_dashboard_and_navigation -k test_mobile_navigation_no_page_overflow -v
      - name: Upload cross-browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamo-${{ matrix.browser }}-qa-evidence
          path: |
            /tmp/gamo-*.png
          if-no-files-found: ignore
