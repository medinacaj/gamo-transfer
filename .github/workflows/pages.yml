name: Validate and deploy GAMO TRANSFER
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate financial and operational rules
        run: node --test tests/*.test.js
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check agency-reports.js
          node --check ui-preferences.js
          node --check domain.js

      - name: Check deploy-verification and browser-test syntax
        run: python3 -m py_compile scripts/verify_deployment.py tests/browser.py
      - name: Check deployment verifier against stale and fresh versions
        run: python3 -m unittest discover -s tests -p test_deployment.py -v
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html styles.css domain.js app.js agency-reports.js ui-preferences.js reportes-agencias.html gamo-logo.svg gp-travel-logo.svg _site/
          touch _site/.nojekyll
      - name: Version deployed assets automatically
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          page = Path("_site/index.html")
          html = page.read_text(encoding="utf-8")
          build = os.environ["BUILD_SHA"]
          revision = build[:12]
          for asset in ("styles.css", "domain.js", "ui-preferences.js", "agency-reports.js", "app.js"):
              pattern = rf'(?<=")({re.escape(asset)})(?:\?v=[^"]*)?(?=")'
              html, count = re.subn(pattern, lambda m: f"{m.group(1)}?v={revision}", html)
              if count != 1:
                  raise SystemExit(f"Expected one asset reference to {asset}, found {count}")
          page.write_text(html, encoding="utf-8")
          Path("_site/build-info.txt").write_text(f"commit={build}\n", encoding="utf-8")
          print(f"Asset cache revision: {revision}")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published version and public resources
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_SHA: ${{ github.sha }}
        run: python3 scripts/verify_deployment.py "$DEPLOY_URL" "$BUILD_SHA"
